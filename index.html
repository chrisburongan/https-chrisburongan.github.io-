<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Rendel & Danica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://lh3.googleusercontent.com/d/10LKJ2zIe5h8ePkqjy2TejTgunb5uhqKA');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .monogram {
            border: 1px solid white;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 3px;
        }
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin-bottom: 3rem;
            letter-spacing: 5px;
        }
        .btn-open {
            border: 1px solid white;
            color: white;
            padding: 10px 40px;
            border-radius: 50px;
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-open:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

    <!-- Landing Page (Hero) -->
    <section class="hero-section">
        <div class="monogram">R & D</div>
        <h1 class="names">RENDEL & DANICA</h1>
        <button class="btn btn-open" onclick="window.location.href='#invitation'">OPEN</button>
    </section>

    <!-- Main Invitation Content -->
    <section id="invitation" class="py-5 bg-light">
        <div class="container text-center">
            <h2 class="display-5 font-serif mb-4">You're Invited!</h2>
            <p class="lead">Kami mengundang Bapak/Ibu/Saudara/i untuk merayakan pernikahan kami.</p>
            <!-- Anda bisa menambahkan konten detail acara lainnya di sini menggunakan grid system Bootstrap -->
        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
