<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Rendel & Danica</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Wedding Invitation of Rendel Moises & Danica Sabanal - September 9, 2026. Handcrafted by Mahal Kita Project.">

    <!-- Tailwind CSS CDN -->

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        springSage: {

                        },

                            600: '#E57373',
                        },
                        springOrange: {
                            50: '#FFFDF9',
                            100: '#FFE0B2',

                            600: '#FFA726',

    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Babel Framework for Static Client Executions -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Luxury Animations & Visual FX -->
    <style>
        @keyframes drift-petal {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            15% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        @keyframes float-butterfly {
            0% { transform: translate(0, 0) rotate(0deg) scale(0.8); }
            50% { transform: translate(40px, -40px) rotate(10deg) scale(1); }
            100% { transform: translate(80px, 10px) rotate(-5deg) scale(0.8); }
        }

        .falling-petal {
            position: absolute;
            pointer-events: none;
            animation: drift-petal 18s linear infinite;
        }

        .animated-butterfly {
            position: absolute;
            pointer-events: none;
            animation: float-butterfly 20s ease-in-out infinite alternate;
        }

        @keyframes slow-zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.07); }
        }
        .zoom-cinematic {
            animation: slow-zoom 25s ease-out forwards infinite alternate;
        }

        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-vinyl {
            animation: spin-vinyl 10s linear infinite;
        }

        /* Responsive Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFFDF9;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFCDD2;
            border-radius: 9px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF8A80;
        }

        /* Glassmorphism utility card styling */
        .glass-card {
            background: rgba(255, 253, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-warmCream text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-springCoral-100">

    <!-- Div container target for compiling static React DOM layout -->
    <div id="root"></div>

    <!-- Hidden YouTube Player Container (Loaded Asynchronously via YouTube Iframe API) -->
    <div id="yt-player-container" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden; pointer-events: none;">
        <div id="yt-player"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Verified Real Wedding Details Data (No Fictional Content)
        const WEDDING_CONFIG = {
            couple: {
                groom: {
                    fullName: "Rendel Moises",
                    shortName: "Rendel",
                    parents: "Mr. Chrisanto Moises & Mrs. Ribka Moises",
                    bio: "An outstanding architect who coordinates life with beauty, grace, and steady direction. Rendel found his anchor and ultimate home within Danica's warm and radiant spirit."
                },
                bride: {
                    fullName: "Danica Sabanal",
                    shortName: "Danica",
                    parents: "Mr. Jhon Sabanal & Mrs. Ruby Sabanal",
                    bio: "A bright soul who transforms every room into a sunny field of wildflowers. Danica found her perfect harmony, trust, and endless laughter inside Rendel's loving presence."
                }
            },
            general: {
                targetDate: "September 9, 2026 15:00:00", // Scheduled Ceremony Date
                hashtag: "#RendelAndDanica2026",
                youtubeVideoId: "X8HUhFSLnl0", // Walk The Moon - Shut Up and Dance (Direct Track request)
                googleFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfN8jG6U-0Nly23P01hA-YOUR-ID/viewform" // Place for your custom Google Form
            },
            events: {
                ceremony: {
                    title: "Holy Solemnization & Vows",
                    date: "Wednesday, September 9, 2026",
                    time: "03:00 PM",
                    venue: "Marco Polo Hotel",
                    address: "C.M. Recto Ave, Davao City, 8000 Davao del Sur, Philippines",
                    mapUrl: "https://maps.google.com/?q=Marco+Polo+Hotel+Davao"
                },
                reception: {
                    title: "Grand Wedding Reception",
                    date: "Wednesday, September 9, 2026",
                    time: "06:00 PM",
                    venue: "Marco Polo Hotel Grand Ballroom",
                    address: "C.M. Recto Ave, Davao City, 8000 Davao del Sur, Philippines",
                    mapUrl: "https://maps.google.com/?q=Marco+Polo+Hotel+Davao"
                }
            },
            photos: {
                // High-performance direct-display Google Drive routing format
                heroBg: "https://drive.google.com/uc?export=view&id=1fSwM8zyAx0geG46VOqoMu8t4HcSetNxh",
                groomPortrait: "https://drive.google.com/uc?export=view&id=13LSsrxTql-mIG9Cknhu4rcuOEe6TYH0H",
                bridePortrait: "https://drive.google.com/uc?export=view&id=1ynp-SXsLJ6zIq0RttaupiTYyTjlJSjXB",
                milestone1: "https://drive.google.com/uc?export=view&id=1duIzeRvw-0A_eXn8CbliVPNuLX4djdeR",
                milestone2: "https://drive.google.com/uc?export=view&id=1Z9s6Pf0neCLejMu4HGeRZVCh2s7CkOVI",
                qrCode: "https://drive.google.com/uc?export=view&id=1-NUiPfH8unFWIR6wye_w4x2V1PdA-16L",
                gallery: [
                    "https://drive.google.com/uc?export=view&id=1fSwM8zyAx0geG46VOqoMu8t4HcSetNxh",
                    "https://drive.google.com/uc?export=view&id=13LSsrxTql-mIG9Cknhu4rcuOEe6TYH0H",
                    "https://drive.google.com/uc?export=view&id=1ynp-SXsLJ6zIq0RttaupiTYyTjlJSjXB",
                    "https://drive.google.com/uc?export=view&id=1duIzeRvw-0A_eXn8CbliVPNuLX4djdeR",
                    "https://drive.google.com/uc?export=view&id=1Z9s6Pf0neCLejMu4HGeRZVCh2s7CkOVI",
                    "https://drive.google.com/uc?export=view&id=10LKJ2zIe5h8ePkqjy2TejTgunb5uhqKA",
                    "https://drive.google.com/uc?export=view&id=1evNyNWYZGjzHilGiHYgwxHy8pzKNk5LW",
                    "https://drive.google.com/uc?export=view&id=162aS9-36fBw7zwRj0awENsHfhbgKcO5q",
                    "https://drive.google.com/uc?export=view&id=1v3BeNmJ3aE6xK66ppivhXC3B_gy0yjGN",
                    "https://drive.google.com/uc?export=view&id=1aTq_StaiozSuy2o4r7qW8zl6MeoM6Fvu"
                ]
            },
            dressCode: {
                theme: "Vibrant Tropical Spring Pastel",
                desc: "We kindly invite our guests to blend into the scenery of our tropical garden ceremony. Elegant semi-formal wear in bright, warm pastel colors is recommended.",
                palettes: [
                    { name: "Coral Peach", color: "#FFB74D", info: "Sunny Peach Blossom" },
                    { name: "Blush Pink", color: "#F8BBD0", info: "Soft Cherry Petal" },
                    { name: "Orchid Purple", color: "#CE93D8", info: "Fresh Spring Lavender" },
                    { name: "Fresh Sage", color: "#81C784", info: "Spring Leaf Green" },
                    { name: "Sunlight Yellow", color: "#FFF59D", info: "Wildflower Gold" },
                    { name: "Morning Sky", color: "#81D4FA", info: "Clear Tropical Blue" }
                ]
            }
        };

        function App() {
            // Local states
            const [guestName, setGuestName] = useState("Our Honored Guest");
            const [isPlaying, setIsPlaying] = useState(false);
            const [lightbox, setLightbox] = useState({ open: false, src: "", index: 0 });
            const [copied, setCopied] = useState(false);
            
            // Wishes ledger logic
            const [wishesList, setWishesList] = useState([]);
            const [wishInput, setWishInput] = useState({ name: "", message: "" });
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                // Parse address parameterized invitation name (?to=Chrisanto+Family)
                const queryParams = new URLSearchParams(window.location.search);
                const nameParam = queryParams.get('to');
                if (nameParam) {
                    setGuestName(nameParam);
                }

                // Hydrate Local wishes registry safely
                const cached = localStorage.getItem('rendel_danica_wedding_wishes');
                if (cached) {
                    try {
                        setWishesList(JSON.parse(cached));
                    } catch (e) {
                        console.error("Local storage wishes parsing error:", e);
                    }
                } else {
                    const fallbackSeed = [
                        { name: "The Mahal Kita Team", message: "Congratulations Rendel and Danica! Wishing you a lifetime of laughter, vibrant moments, and eternal spring!" }
                    ];
                    setWishesList(fallbackSeed);
                    localStorage.setItem('rendel_danica_wedding_wishes', JSON.stringify(fallbackSeed));
                }

                // Load YouTube Player API script dynamically
                const scriptTag = document.createElement('script');
                scriptTag.src = "https://www.youtube.com/iframe_api";
                const firstScript = document.getElementsByTagName('script')[0];
                firstScript.parentNode.insertBefore(scriptTag, firstScript);

                window.onYouTubeIframeAPIReady = () => {
                    window.ytPlayer = new window.YT.Player('yt-player', {
                        height: '1',
                        width: '1',
                        videoId: WEDDING_CONFIG.general.youtubeVideoId,
                        playerVars: {
                            'autoplay': 0,
                            'controls': 0,
                            'disablekb': 1,
                            'fs': 0,
                            'modestbranding': 1,
                            'rel': 0,
                            'loop': 1,
                            'playlist': WEDDING_CONFIG.general.youtubeVideoId
                        },
                        events: {
                            'onReady': () => {
                                console.log("YouTube Player API is connected successfully.");
                            }
                        }
                    });
                };

                // Trigger icon creation
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            // Real-time Countdown Timer controller
            useEffect(() => {
                const targetTime = new Date(WEDDING_CONFIG.general.targetDate).getTime();
                const timerId = setInterval(() => {
                    const now = new Date().getTime();
                    const difference = targetTime - now;

                    if (difference < 0) {
                        clearInterval(timerId);
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                    } else {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((difference % (1000 * 60)) / 1000)
                        });
                    }
                }, 1000);
                return () => clearInterval(timerId);
            }, []);

            // Refresh icons dynamically on states modifications
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [wishesList, lightbox, isPlaying]);

            const handleMusicPlayback = () => {
                if (window.ytPlayer && typeof window.ytPlayer.playVideo === 'function') {
                    if (isPlaying) {
                        window.ytPlayer.pauseVideo();
                    } else {
                        window.ytPlayer.playVideo();
                    }
                    setIsPlaying(!isPlaying);
                } else {
                    console.warn("YouTube API Player is loading. Tap again in 1 second.");
                }
            };

            const handleCopyToClipboard = (text) => {
                const dummyTextarea = document.createElement("textarea");
                document.body.appendChild(dummyTextarea);
                dummyTextarea.value = text;
                dummyTextarea.select();
                document.execCommand("copy");
                document.body.removeChild(dummyTextarea);
                setCopied(true);
                setTimeout(() => setCopied(false), 3000);
            };

            const handlePostWish = (e) => {
                e.preventDefault();
                if (!wishInput.name || !wishInput.message) return;
                const updatedList = [{
                    name: wishInput.name,
                    message: wishInput.message
                }, ...wishesList];
                setWishesList(updatedList);
                localStorage.setItem('rendel_danica_wedding_wishes', JSON.stringify(updatedList));
                setWishInput({ name: "", message: "" });
            };

            const handleExportWishesFile = () => {
                const rawFormat = wishesList.map((w, i) => `${i + 1}. Guest: ${w.name}\nMessage: "${w.message}"\n--------------------`).join('\n\n');
                const fileBlob = new Blob([rawFormat], { type: "text/plain;charset=utf-8" });
                const downloadNode = document.createElement("a");
                downloadNode.href = URL.createObjectURL(fileBlob);
                downloadNode.download = "Wishes_Book_Rendel_and_Danica.txt";
                document.body.appendChild(downloadNode);
                downloadNode.click();
                document.body.removeChild(downloadNode);
            };

            return (
                <div className="relative min-h-screen">
                    
                    {/* Floating Petals Layer overlaying screens */}
                    <div className="fixed inset-0 pointer-events-none z-30 overflow-hidden">
                        {[...Array(8)].map((_, idx) => (
                            <div
                                key={idx}
                                className="falling-petal"
                                style={{
                                    left: `${Math.random() * 95}%`,
                                    width: `${Math.random() * 12 + 8}px`,
                                    height: `${Math.random() * 12 + 8}px`,
                                    backgroundColor: ['#F8BBD0', '#FFCDD2', '#FFF59D', '#81C784'][idx % 4],
                                    borderRadius: '100% 0 100% 100%',
                                    animationDelay: `${Math.random() * -15}s`,
                                    animationDuration: `${Math.random() * 8 + 12}s`
                                }}
                            />
                        ))}
                    </div>

                    {/* Fixed Navigation Menu for easy sections jumping */}
                    <nav className="fixed top-0 inset-x-0 z-40 bg-white/90 backdrop-blur-md border-b border-springSage-100 hidden md:block">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <span className="font-serif text-xl font-bold tracking-widest text-springCoral-600">R & D</span>
                            <div className="flex space-x-8 text-xs font-bold uppercase tracking-widest text-slate-600">
                                <a href="#hero" className="hover:text-springCoral-500 transition-colors">Home</a>
                                <a href="#welcome" className="hover:text-springCoral-500 transition-colors">Welcome</a>
                                <a href="#couple" className="hover:text-springCoral-500 transition-colors">The Couple</a>
                                <a href="#details" className="hover:text-springCoral-500 transition-colors">Schedules</a>
                                <a href="#gallery" className="hover:text-springCoral-500 transition-colors">Gallery</a>
                                <a href="#reservation" className="hover:text-springCoral-500 transition-colors">RSVP</a>
                                <a href="#registry" className="hover:text-springCoral-500 transition-colors">Love Gifts</a>
                            </div>
                        </div>
                    </nav>

                    {/* Floating Audio Vinyl Controller */}
                    <button
                        onClick={handleMusicPlayback}
                        className="fixed bottom-6 right-6 z-40 bg-white border border-springSage-200 p-3 rounded-full shadow-xl flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95"
                        title="Play / Mute Music"
                    >
                        <div className={`w-9 h-9 bg-slate-900 rounded-full flex items-center justify-center text-white ${isPlaying ? 'spin-vinyl' : ''}`}>
                            <div className="w-3.5 h-3.5 bg-springGold-400 rounded-full flex items-center justify-center">
                                <div className="w-1.5 h-1.5 bg-slate-900 rounded-full" />
                            </div>
                        </div>
                        {isPlaying ? (
                            <div className="flex items-end space-x-0.5 h-3.5 ml-2.5 animate-pulse pr-1">
                                <div className="w-[2px] h-2.5 bg-springCoral-500 rounded-full animate-bounce" />
                                <div className="w-[2px] h-3.5 bg-springSage-500 rounded-full animate-bounce" style={{ animationDelay: '0.15s' }} />
                                <div className="w-[2px] h-2 bg-springGold-400 rounded-full animate-bounce" style={{ animationDelay: '0.3s' }} />
                            </div>
                        ) : (
                            <span className="text-[10px] text-slate-500 font-bold ml-2.5 pr-1 font-sans">TAP PLAY</span>
                        )}
                    </button>

                    {/* HERO BILLBOARD BANNER */}
                    <header id="hero" className="relative min-h-screen flex flex-col justify-between items-center text-center px-4 py-16 overflow-hidden bg-slate-900">
                        <div className="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/60 z-10"></div>
                        <div className="absolute inset-0 overflow-hidden">
                            <img
                                src={WEDDING_CONFIG.photos.heroBg}
                                alt="Rendel and Danica Portrait Backdrop"
                                className="w-full h-full object-cover zoom-cinematic"
                            />
                        </div>

                        {/* Top Accent Initials */}
                        <div className="z-20 text-white mt-12 md:mt-24">
                            <span className="text-[10px] tracking-[0.4em] text-springGold-400 font-bold uppercase block mb-3 font-sans">TROPICAL SPRING CELEBRATION</span>
                            <h2 className="font-serif italic text-2xl tracking-widest text-white/95">R &amp; D</h2>
                            <div className="w-10 h-[1.5px] bg-white/30 mx-auto mt-2.5"></div>
                        </div>

                        {/* Names & Taglines Centerpiece */}
                        <div className="z-20 max-w-4xl mx-auto my-auto py-12">
                            <p className="font-garamond text-2xl md:text-3xl text-white/95 italic font-medium tracking-wide mb-3">
                                "Together Forever Begins Here"
                            </p>
                            <h1 className="font-serif text-5xl md:text-8xl font-bold text-white tracking-wider leading-none drop-shadow-2xl">
                                Rendel <span className="font-garamond italic font-light text-3xl md:text-6xl text-springGold-400">&amp;</span> Danica
                            </h1>
                            <p className="text-white/85 text-xs md:text-sm font-bold tracking-[0.3em] uppercase mt-6 max-w-lg mx-auto">
                                September 9, 2026 • Marco Polo Hotel
                            </p>
                        </div>

                        {/* Real-time Countdown Counter Board */}
                        <div className="z-20 w-full max-w-lg mx-auto bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-[30px] shadow-2xl mb-4">
                            <span className="text-[9px] font-bold tracking-[0.3em] text-springGold-400 block mb-4 uppercase font-sans">COUNTING EVERY SECOND</span>
                            <div className="grid grid-cols-4 gap-4">
                                <div>
                                    <span className="block font-serif text-3xl md:text-4xl text-white font-bold">{timeLeft.days}</span>
                                    <span className="text-[9px] uppercase font-bold text-white/60 tracking-widest">Days</span>
                                </div>
                                <div>
                                    <span className="block font-serif text-3xl md:text-4xl text-white font-bold">{timeLeft.hours}</span>
                                    <span className="text-[9px] uppercase font-bold text-white/60 tracking-widest">Hours</span>
                                </div>
                                <div>
                                    <span className="block font-serif text-3xl md:text-4xl text-white font-bold">{timeLeft.minutes}</span>
                                    <span className="text-[9px] uppercase font-bold text-white/60 tracking-widest">Mins</span>
                                </div>
                                <div>
                                    <span className="block font-serif text-3xl md:text-4xl text-white font-bold">{timeLeft.seconds}</span>
                                    <span className="text-[9px] uppercase font-bold text-white/60 tracking-widest">Secs</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* PERSONALIZED WELCOME CARD */}
                    <section id="welcome" className="py-24 px-6 bg-gradient-to-b from-springCoral-50 via-warmCream to-springSage-50 relative overflow-hidden">
                        <div className="max-w-3xl mx-auto text-center relative z-10">
                            <span className="text-xs font-bold text-springSage-800 tracking-[0.3em] uppercase block mb-3 font-sans">YOU ARE WARMLY WELCOMED</span>
                            <h3 className="font-serif text-3xl md:text-5xl font-bold text-slate-800 mb-2 italic">Dear “{guestName}”</h3>
                            <div className="w-16 h-[2px] bg-springSage-500 mx-auto mt-4 mb-6 rounded-full"></div>
                            <p className="font-garamond text-xl md:text-2xl text-slate-600 leading-relaxed max-w-2xl mx-auto">
                                "Because you have shared in our lives with your warmth, friendship, and kind love, we request the pleasant honor of your presence to celebrate our marriage."
                            </p>
                        </div>
                    </section>

                    {/* BLESSED COUPLE PROFILE SECTION */}
                    <section id="couple" className="py-24 px-6 bg-white relative overflow-hidden border-t border-springSage-100">
                        <div className="max-w-6xl mx-auto">
                            <div className="text-center mb-16">
                                <span className="text-xs font-bold text-springSage-800 tracking-[0.35em] uppercase block mb-2 font-sans">THE SOULS BEYOND PLACE</span>
                                <h2 className="font-serif text-3xl md:text-5xl font-bold text-slate-800">The Blessed Couple</h2>
                                <div className="w-16 h-[2px] bg-springSage-500 mx-auto mt-4 rounded-full"></div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-stretch">
