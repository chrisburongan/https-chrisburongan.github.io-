  html, body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
  .font-serif { font-family: 'Playfair Display', serif; }
  .font-sans { font-family: 'Inter', sans-serif; }

  @keyframes drift-petal {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(0.6); opacity: 0; }
    15% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translateY(110vh) translateX(120px) rotate(360deg) scale(1); opacity: 0; }
  }
  @keyframes drift-butterfly {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.8); }
    50% { transform: translate(45px, -45px) rotate(15deg) scale(1.1); }
    100% { transform: translate(90px, 15px) rotate(-10deg) scale(0.8); }
  }
  .falling-petal { position: absolute; pointer-events: none; animation: drift-petal 20s linear infinite; }
  .flying-butterfly { position: absolute; pointer-events: none; animation: drift-butterfly 22s ease-in-out infinite alternate; }

  @keyframes slow-zoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }
  .zoom-cinematic { animation: slow-zoom 30s ease-out forwards infinite alternate; }

  @keyframes spin-vinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin-vinyl { animation: spin-vinyl 12s linear infinite; }

  .glassmorphic {
    background: rgba(255, 253, 249, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .hover-scale-102:hover { transform: scale(1.02); }

  @keyframes fade-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fade-in 0.25s ease-out; }
</style>

function App() {
  const [guestName, setGuestName] = useState("Our Honored Guest");
  const [isPlaying, setIsPlaying] = useState(false);
  const [lightbox, setLightbox] = useState({ open: false, src: "", index: 0 });
  const [copied, setCopied] = useState(false);
  const [mobileMenu, setMobileMenu] = useState(false);

  const [wishesList, setWishesList] = useState([]);
  const [wishInput, setWishInput] = useState({ name: "", message: "" });
  const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
  const [faqOpen, setFaqOpen] = useState([false, false, false]);
  const [ytReady, setYtReady] = useState(false);

  useEffect(() => {
    // 1. Parse URL Parameter ?to=Chrisanto+Family
    const queryParams = new URLSearchParams(window.location.search);
    const nameParam = queryParams.get('to');
    if (nameParam) {
      setGuestName(nameParam);
    }

    // 2. Hydrate localStorage Wishes Registry
    try {
      const cachedWishes = localStorage.getItem('mahal_kita_rendel_danica_wishes');
      if (cachedWishes) {
        setWishesList(JSON.parse(cachedWishes));
      } else {
        const initialSeed = [
          { name: "The Mahal Kita Project Team", message: "Sending you endless love, blessings, and laughter on your journey! May your life be as beautiful and vibrant as a spring morning." }
        ];
        setWishesList(initialSeed);
        localStorage.setItem('mahal_kita_rendel_danica_wishes', JSON.stringify(initialSeed));
      }
    } catch (e) {
      console.error("Local guestbook loading error: ", e);
      setWishesList([
        { name: "The Mahal Kita Project Team", message: "Sending you endless love, blessings, and laughter on your journey!" }
      ]);
    }

    // 3. Load YouTube Iframe Player API
    const loadYT = () => {
      if (window.YT && window.YT.Player) {
        initPlayer();
        return;
      }
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      window.onYouTubeIframeAPIReady = initPlayer;
    };

    function initPlayer() {
      window.ytPlayer = new window.YT.Player('youtube-audio-streamer', {
        height: '1',
        width: '1',
        videoId: WEDDING_CONFIG.general.youtubeVideoId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          loop: 1,
          playlist: WEDDING_CONFIG.general.youtubeVideoId
        },
        events: {
          onReady: () => setYtReady(true)
        }
      });
    }

    loadYT();
  }, []);

  // Real-time Countdown Timer
  useEffect(() => {
    const target = new Date(WEDDING_CONFIG.general.targetDate).getTime();
    const interval = setInterval(() => {
      const now = new Date().getTime();
      const distance = target - now;

      if (distance < 0) {
        clearInterval(interval);
        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      } else {
        setTimeLeft({
          days: Math.floor(distance / (1000 * 60 * 60 * 24)),
          hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
          minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
          seconds: Math.floor((distance % (1000 * 60)) / 1000)
        });
      }
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  const handleMusicPlayback = () => {
    if (window.ytPlayer && typeof window.ytPlayer.playVideo === 'function') {
      if (isPlaying) {
        window.ytPlayer.pauseVideo();
      } else {
        window.ytPlayer.playVideo();
      }
      setIsPlaying(!isPlaying);
    } else {
      console.warn("Audio engine still initializing. Please tap again in 1 second.");
    }
  };

  const handleCopyToClipboard = (text) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  };

  const fallbackCopy = (text) => {
    const tempInput = document.createElement("textarea");
    tempInput.value = text;
    tempInput.style.position = "fixed";
    tempInput.style.opacity = "0";
    document.body.appendChild(tempInput);
    tempInput.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.error("Copy failed", err);
    }
    document.body.removeChild(tempInput);
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const handlePostWish = (e) => {
    e.preventDefault();
    if (!wishInput.name || !wishInput.message) return;
    const newList = [{ name: wishInput.name, message: wishInput.message }, ...wishesList];
    setWishesList(newList);
    try {
      localStorage.setItem('mahal_kita_rendel_danica_wishes', JSON.stringify(newList));
    } catch (e) {
      console.error("Could not save wish to localStorage", e);
    }
    setWishInput({ name: "", message: "" });
  };

  const handleDownloadLedger = () => {
    const header = "=========================================\n  WISHES BOOK - RENDEL & DANICA\n=========================================\n\n";
    const body = wishesList.map((w, i) => `${i + 1}. Guest Name: ${w.name}\nMessage: "${w.message}"\n\n-----------------------------`).join('\n\n');
    const blob = new Blob([header + body], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Wishes_Rendel_and_Danica.txt";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const toggleFaq = (index) => {
    setFaqOpen(faqOpen.map((state, i) => i === index ? !state : state));
  };

  return (
    <div className="relative min-h-screen bg-[#FFFDF9] text-slate-800 font-sans antialiased selection:bg-rose-100 overflow-x-hidden">

      {/* Hidden YouTube Iframe Audio Node */}
      <div id="youtube-audio-streamer" className="absolute top-[-9999px] left-[-9999px] pointer-events-none opacity-0" />

      {/* FLOATING BUTTERFLIES AND PETALS LAYER */}
      <div className="fixed inset-0 pointer-events-none z-30 overflow-hidden">
        {[...Array(10)].map((_, idx) => (
          <div
            key={idx}
            className="falling-petal"
            style={{
              left: `${Math.random() * 95}%`,
              width: `${Math.random() * 14 + 10}px`,
              height: `${Math.random() * 14 + 10}px`,
              backgroundColor: ['#F8BBD0', '#FFCDD2', '#FFF59D', '#C8E6C9'][idx % 4],
              borderRadius: '100% 0 100% 100%',
              animationDelay: `${Math.random() * -18}s`,
              animationDuration: `${Math.random() * 10 + 15}s`
            }}
          />
        ))}

        {[...Array(2)].map((_, idx) => (
          <svg
            key={idx}
            className="flying-butterfly opacity-40 text-rose-300 w-8 h-8"
            viewBox="0 0 24 24"
            fill="currentColor"
            style={{
              top: `${Math.random() * 60 + 20}%`,
              left: `${Math.random() * 85}%`,
              animationDelay: `${idx * -6}s`,
              animationDuration: '28s'
            }}
          >
            <path d="M12 10C11.5 5.5 6 3 3 6c0 0-1 2 2 5 .5.5 1 .5 1.5 0M12 10c.5-4.5 6-7 9-4 0 0 1 2-2 5-.5.5-1 .5-1.5 0M12 10c-.5 4.5-5 7-7 4 0 0-1-1.5 1.5-3.5M12 10c.5 4.5 5 7 7 4 0 0 1-1.5-1.5-3.5" />
          </svg>
        ))}
      </div>

      {/* FLOATING AUDIO CONTROLLER */}
      <button
        onClick={handleMusicPlayback}
        className="fixed bottom-6 right-6 z-50 bg-white border border-rose-100 p-3 rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95"
        title="Play / Pause Romantic Track"
      >
        <div className={`w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white ${isPlaying ? 'spin-vinyl' : ''}`}>
          <div className="w-4 h-4 bg-amber-200 rounded-full flex items-center justify-center">
            <div className="w-1.5 h-1.5 bg-slate-900 rounded-full" />
          </div>
        </div>
        {isPlaying ? (
          <div className="flex items-end space-x-0.5 h-4 ml-3 pr-1">
            <div className="w-[3px] h-3 bg-rose-500 rounded-full animate-bounce" />
            <div className="w-[3px] h-4 bg-emerald-500 rounded-full animate-bounce" style={{ animationDelay: '0.15s' }} />
            <div className="w-[3px] h-2.5 bg-amber-400 rounded-full animate-bounce" style={{ animationDelay: '0.3s' }} />
          </div>
        ) : (
          <span className="text-[10px] text-slate-500 font-bold ml-3 pr-1 font-sans tracking-widest uppercase">PLAY MUSIC</span>
        )}
      </button>

      {/* HEADER NAVIGATION (DESKTOP) */}
      <nav className="fixed top-0 inset-x-0 z-40 bg-white/90 backdrop-blur-md border-b border-emerald-50 hidden md:block">
        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
          <span className="font-serif text-xl font-bold tracking-widest text-emerald-800">R & D</span>
          <div className="flex space-x-8 text-xs font-bold uppercase tracking-[0.2em] text-slate-600 font-sans">
            <a href="#hero" className="hover:text-rose-500 transition-colors">Home</a>
            <a href="#welcome" className="hover:text-rose-500 transition-colors">Welcome</a>
            <a href="#couple" className="hover:text-rose-500 transition-colors">The Couple</a>
            <a href="#story" className="hover:text-rose-500 transition-colors">Our Story</a>
            <a href="#details" className="hover:text-rose-500 transition-colors">Schedules</a>
            <a href="#gallery" className="hover:text-rose-500 transition-colors">Gallery</a>
            <a href="#rsvp" className="hover:text-rose-500 transition-colors">RSVP</a>
            <a href="#registry" className="hover:text-rose-500 transition-colors">Gifts</a>
          </div>
        </div>
      </nav>

      {/* MOBILE HEADER BAR */}
      <header className="fixed top-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-b border-emerald-50 flex justify-between items-center px-6 py-4 md:hidden">
        <span className="font-serif text-lg font-bold tracking-widest text-emerald-800">R & D</span>
        <button
          onClick={() => setMobileMenu(!mobileMenu)}
          className="text-slate-700 hover:text-rose-500 transition-colors focus:outline-none"
        >
          {mobileMenu ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
        </button>
      </header>

      {/* MOBILE DRAWER */}

                key={idx}

                className="overflow-hidden rounded-3xl cursor-pointer relative group border border-slate-100 shadow-sm break-inside-avoid hover:shadow-lg transition-all duration-300"
              >
                <img
                  src={imgUrl}
                  alt={`Wedding Moment ${idx + 1}`}
                  className="w-full object-cover rounded-3xl hover-scale-102 transition-transform duration-500"
                  loading="lazy"
                />
                <div className="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                  <span className="text-white text-xs font-semibold uppercase tracking-wider font-sans border border-white/40 px-3 py-1 rounded-full">Zoom View</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        {lightbox.open && (
          <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
            <button
              onClick={() => setLightbox({ open: false, src: "", index: 0 })}
              className="absolute top-6 right-6 text-white hover:scale-110 transition-transform p-3 bg-white/10 rounded-full"
            >
              <X className="w-6 h-6" />
            </button>

            <button
              onClick={() => {
                const prevIndex = (lightbox.index - 1 + WEDDING_CONFIG.photos.gallery.length) % WEDDING_CONFIG.photos.gallery.length;
                setLightbox({ open: true, src: WEDDING_CONFIG.photos.gallery[prevIndex], index: prevIndex });
              }}
              className="absolute left-4 text-white hover:scale-125 transition-transform bg-white/10 p-3 rounded-full"
            >
              <span className="font-bold text-lg font-sans">&lt;</span>
            </button>

            <div className="max-w-4xl max-h-[80vh] rounded-3xl overflow-hidden border border-white/20 shadow-2xl">
              <img src={lightbox.src} alt="Zoomed wedding capture" className="max-w-full max-h-[75vh] object-contain mx-auto" />
            </div>

            <button
              onClick={() => {
                const nextIndex = (lightbox.index + 1) % WEDDING_CONFIG.photos.gallery.length;
                setLightbox({ open: true, src: WEDDING_CONFIG.photos.gallery[nextIndex], index: nextIndex });
              }}
              className="absolute right-4 text-white hover:scale-125 transition-transform bg-white/10 p-3 rounded-full"
            >
              <span className="font-bold text-lg font-sans">&gt;</span>
            </button>
          </div>
        )}
      </section>

      {/* EMBEDDED MAP SECTION */}
      <section className="relative w-full h-[450px] border-t border-b border-emerald-50 bg-slate-100">
        <iframe
          title="Marco Polo Hotel Davao"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3959.0881951591874!2d125.61058231477464!3d7.0692582948943345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x32f96d773da01a59%3A0xe54be8911b312b93!2sMarco%20Polo%20Hotel!5e0!3m2!1sen!2sph!4v1680000000000!5m2!1sen!2sph"
          className="absolute inset-0 w-full h-full border-none"
          style={{ filter: 'contrast(95%)' }}
          allowFullScreen
          loading="lazy"
        />
      </section>

      {/* RSVP FORM SECTION & GUESTBOOK */}
      <section id="rsvp" className="py-24 px-6 bg-white relative overflow-hidden">
        <div className="max-w-5xl mx-auto">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">

            <div className="bg-[#EAF5EC]/40 border border-emerald-200 rounded-[45px] p-8 md:p-10 shadow-sm text-center">
              <span className="text-[10px] font-bold text-emerald-800 tracking-[0.25em] uppercase block mb-1 font-sans">RESERVE YOUR MEADOW SEAT</span>
              <h3 className="font-serif text-3xl font-bold text-slate-800 mb-4">Confirm Presence</h3>
              <p className="text-xs text-slate-500 mb-8 leading-relaxed font-sans">
                We are excited to share this beautiful spring day with you. Please click the button below to complete your Google Form RSVP and finalize your seat reservations!
              </p>

              <a
                href={WEDDING_CONFIG.general.googleFormUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center justify-center space-x-3 w-full bg-emerald-600 hover:bg-emerald-800 text-white font-bold tracking-widest py-4 px-6 rounded-2xl shadow-lg transition-all transform hover:scale-[1.01] active:scale-[0.99] uppercase text-xs font-sans"
              >
                <span>Click Here to RSVP (Google Form)</span>
                <ExternalLink className="w-4 h-4" />
              </a>
            </div>

            <div className="flex flex-col justify-between h-full space-y-8">
              <div>
                <span className="text-[10px] font-bold text-rose-500 tracking-[0.25em] uppercase block mb-1 font-sans">VIRTUAL SPRING GUESTBOOK</span>
                <h3 className="font-serif text-3xl font-bold text-slate-800 mb-4">Wishes Book</h3>
                <p className="text-xs text-slate-500 mb-6 leading-relaxed font-sans">
                  Write down your lovely wedding prayers and wishes for the couple here. Messages are securely logged in your local browser storage.
                </p>

                <form onSubmit={handlePostWish} className="space-y-4 mb-6">
                  <input
                    type="text"
                    required
                    placeholder="Your Full Name"
                    value={wishInput.name}
                    onChange={(e) => setWishInput({...wishInput, name: e.target.value})}
                    className="w-full px-4 py-3 text-xs border border-emerald-100 bg-[#EAF5EC]/20 rounded-2xl focus:outline-none focus:border-emerald-500 font-sans"
                  />
                  <textarea
                    rows="3"
                    required
                    placeholder="Write your blessings and beautiful messages here..."
                    value={wishInput.message}
                    onChange={(e) => setWishInput({...wishInput, message: e.target.value})}
                    className="w-full px-4 py-3 text-xs border border-emerald-100 bg-[#EAF5EC]/20 rounded-2xl focus:outline-none focus:border-emerald-500 resize-none font-sans"
                  />
                  <button
                    type="submit"
                    className="w-full bg-slate-900 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-2xl text-xs tracking-wider transition-all uppercase font-sans"
                  >
                    Post Wishes
                  </button>
                </form>
              </div>

              <div className="bg-[#EAF5EC]/40 rounded-[35px] p-6 border border-emerald-100/50 max-h-[250px] overflow-y-auto space-y-4 shadow-inner">
                {wishesList.map((w, idx) => (
                  <div key={idx} className="border-b border-slate-100/80 pb-3 last:border-none font-sans">
                    <div className="flex items-center space-x-2 mb-1">
                      <span className="font-bold text-xs text-slate-800">{w.name}</span>
                      <span className="text-[8px] font-bold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full uppercase">
                        Guest
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 italic">"{w.message}"</p>
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-2 gap-3 mt-4">
                <button
                  type="button"
                  onClick={() => {
                    const wishesRaw = wishesList.map(w => `From: ${w.name}\nMessage: "${w.message}"`).join('\n\n');
                    handleCopyToClipboard(wishesRaw);
                  }}
                  className="inline-flex items-center justify-center space-x-1.5 py-3 px-4 border border-emerald-200 hover:bg-emerald-50 text-emerald-800 font-semibold rounded-2xl text-xs transition-colors font-sans"
                >
                  <Copy className="w-4 h-4" />
                  <span>{copied ? 'Copied Ledger!' : 'Copy Wishes'}</span>
                </button>
                <button
                  type="button"
                  onClick={handleDownloadLedger}
                  className="inline-flex items-center justify-center space-x-1.5 py-3 px-4 bg-emerald-100/50 hover:bg-emerald-100 text-emerald-800 font-semibold rounded-2xl text-xs transition-colors font-sans"
                >
                  <Download className="w-4 h-4" />
                  <span>Download Ledger</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      </section>

      {/* WEDDING GIFT REGISTRY */}
      <section id="registry" className="py-24 px-6 bg-[#EAF5EC]/15 border-t border-emerald-50 relative overflow-hidden">
        <div className="max-w-4xl mx-auto text-center">
          <div className="mb-16">
            <span className="text-[10px] font-bold text-emerald-800 tracking-[0.35em] uppercase block mb-1 font-sans">LOVE &amp; GIFTS MEADOW</span>
            <h2 className="font-serif text-3xl md:text-5xl font-bold text-slate-800">Wedding Registry</h2>
            <div className="w-16 h-[2px] bg-emerald-400 mx-auto mt-4 rounded-full" />
            <p className="text-slate-500 text-xs md:text-sm mt-4 max-w-lg mx-auto leading-relaxed font-sans font-medium">
              Your warm presence is the ultimate flower in our garden. However, if you would like to help us establish our brand new path, we invite you to use our direct bank details below:
            </p>
          </div>

          <div className="max-w-md mx-auto bg-white border border-emerald-100 rounded-[45px] p-8 shadow-md relative overflow-hidden flex flex-col items-center">
            <div className="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-emerald-100 to-transparent rounded-full filter blur-md opacity-40" />

            <div className="w-12 h-12 bg-[#EAF5EC] border border-emerald-100 rounded-full flex items-center justify-center mb-6 text-emerald-800 shadow-sm">
              <Gift className="w-5 h-5" />
            </div>

            <span className="font-serif font-bold text-slate-800 tracking-wider text-xl mb-1">BDO Bank Registry</span>
            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6 font-sans">ACCOUNT OWNER: RENDEL MOISES</span>

            <div className="w-52 h-52 bg-white border-2 border-emerald-50 rounded-2xl overflow-hidden p-2 flex items-center justify-center shadow-inner mb-6">
              <img
                src={WEDDING_CONFIG.photos.qrCode}
                alt="Rendel Moises BDO QR Code"
                className="w-full h-full object-contain"
                onError={(e) => {
                  e.target.src = "https://placehold.co/250x250/fff3f3/333333?text=BDO+QR+CODE";
                }}
              />
            </div>

            <button
              onClick={() => handleCopyToClipboard("Rendel Moises - BDO Bank")}
              className="w-full py-3.5 bg-[#EAF5EC] hover:bg-emerald-100 border border-emerald-200 text-emerald-800 font-bold rounded-2xl text-xs tracking-wider transition-all inline-flex items-center justify-center space-x-2 font-sans shadow-sm"
            >
              <Copy className="w-4 h-4 text-emerald-600" />
              <span>Copy Registry Details</span>
            </button>
          </div>
        </div>
      </section>

      {/* FAQ */}
      <section className="py-24 px-6 bg-white relative overflow-hidden">
        <div className="max-w-4xl mx-auto">
          <div className="text-center mb-16">
            <span className="text-xs font-bold text-emerald-800 tracking-[0.35em] uppercase block mb-1 font-sans">HELPFUL WEDDING GUIDES</span>
            <h2 className="font-serif text-3xl md:text-5xl font-bold text-slate-800">Frequently Asked Questions</h2>
            <div className="w-16 h-[2px] bg-emerald-400 mx-auto mt-4 rounded-full" />
          </div>

          <div className="space-y-4 max-w-2xl mx-auto font-sans">

            <div className="border border-emerald-100 rounded-3xl bg-[#EAF5EC]/20 overflow-hidden shadow-sm">
              <div
                onClick={() => toggleFaq(0)}
                className="p-5 font-serif font-bold text-slate-800 text-sm md:text-base flex justify-between items-center cursor-pointer select-none"
              >
                <span>What is the dress code?</span>
                <HelpCircle className="w-4 h-4 text-emerald-800" />
              </div>
              {faqOpen[0] && (
                <p className="px-5 pb-5 text-xs md:text-sm text-slate-500 leading-relaxed font-sans animate-fade-in">
                  The official dress code is {WEDDING_CONFIG.dressCode.theme}. We invite our guests to wear semi-formal wear in bright, warm pastel colors to match the spring garden scenery.
                </p>
              )}
            </div>

            <div className="border border-emerald-100 rounded-3xl bg-[#EAF5EC]/20 overflow-hidden shadow-sm">
              <div
                onClick={() => toggleFaq(1)}
                className="p-5 font-serif font-bold text-slate-800 text-sm md:text-base flex justify-between items-center cursor-pointer select-none"
              >
                <span>Is there guest parking at the hotel?</span>
                <HelpCircle className="w-4 h-4 text-emerald-800" />
              </div>
              {faqOpen[1] && (
                <p className="px-5 pb-5 text-xs md:text-sm text-slate-500 leading-relaxed font-sans animate-fade-in">
                  Yes, secure complimentary guest parking is available at the Marco Polo Hotel Davao venue for all wedding attendees.
                </p>
              )}
            </div>

            <div className="border border-emerald-100 rounded-3xl bg-[#EAF5EC]/20 overflow-hidden shadow-sm">
              <div
                onClick={() => toggleFaq(2)}
                className="p-5 font-serif font-bold text-slate-800 text-sm md:text-base flex justify-between items-center cursor-pointer select-none"
              >
                <span>What wedding gifts are preferred?</span>
                <HelpCircle className="w-4 h-4 text-emerald-800" />
              </div>
              {faqOpen[2] && (
                <p className="px-5 pb-5 text-xs md:text-sm text-slate-500 leading-relaxed font-sans animate-fade-in">
                  Your warm presence is already the greatest present we could ask for! However, if you would like to help us build our new home, cash contributions via our BDO registry are deeply appreciated.
                </p>
              )}
            </div>

          </div>
        </div>
      </section>

      {/* CLOSING PANEL */}
      <section className="py-24 px-6 bg-[#EAF5EC]/20 text-center relative overflow-hidden border-t border-emerald-50">
        <div className="max-w-3xl mx-auto">
          <div className="relative w-64 h-80 mx-auto mb-10 rounded-[60px_10px_60px_10px] overflow-hidden border border-emerald-200 shadow-2xl bg-slate-100">
            <img
              src={WEDDING_CONFIG.photos.heroBg}
              alt="Rendel and Danica Together Forever"
              className="w-full h-full object-cover"
            />
          </div>

          <p className="font-serif text-3xl md:text-4xl italic text-slate-800 font-bold mb-4">
            With Sincerest Gratitude
          </p>
          <p className="text-xs md:text-sm text-slate-500 max-w-md mx-auto leading-relaxed mb-8 font-sans font-medium">
            Thank you for being an irreplaceable part of our lives and love story. We cannot wait to celebrate these precious moments under the beautiful spring wildflowers!
          </p>

          <h2 className="font-serif text-3xl md:text-5xl text-rose-400 font-bold mb-1">
            Rendel &amp; Danica
          </h2>
          <p className="text-[10px] font-bold text-emerald-800 tracking-[0.3em] uppercase mt-2 font-sans">
            {WEDDING_CONFIG.general.hashtag}
          </p>
        </div>
      </section>

      <footer className="bg-slate-950 text-white/90 py-12 px-6 text-center border-t border-white/10 font-sans">
        <div className="max-w-4xl mx-auto">
          <span className="font-serif text-2xl font-bold tracking-widest text-rose-400">R &amp; D</span>
          <p className="text-[10px] text-slate-400 mt-2 tracking-widest uppercase">Crafted by Mahal Kita Project.</p>
          <div className="w-12 h-[1px] bg-white/20 mx-auto my-6" />
          <p className="text-[9px] text-slate-500 max-w-xs mx-auto leading-normal">
            All details verified. Dynamic invitations deployed seamlessly.
          </p>
        </div>
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
