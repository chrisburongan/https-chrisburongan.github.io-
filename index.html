<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation: Rendel & Danica</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdfaf6; color: #4a4a4a; margin: 0; overflow-x: hidden; }
        
        /* Gatekeeper styles */
        #gatekeeper {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://lh3.googleusercontent.com/d/10LKJ2zIe5h8ePkqjy2TejTgunb5uhqKA');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; transition: opacity 1s ease-in-out;
        }

        #ambientCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(135deg, #fdfaf6 0%, #fff1f2 100%); }

        .hero-section { height: 100vh; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://lh3.googleusercontent.com/d/10LKJ2zIe5h8ePkqjy2TejTgunb5uhqKA'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        
        .monogram { font-family: 'Dancing Script', cursive; font-size: 3rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .names { font-family: 'Dancing Script', cursive; font-size: 5rem; margin-bottom: 2rem; color: #ffeff5; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        .btn-open { border: 2px solid #ff9a9e; color: white; padding: 15px 50px; border-radius: 50px; background: #ff9a9e; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; transition: 0.4s; cursor: pointer; border: none; }
        .btn-open:hover { background: #f87198; transform: translateY(-5px); }

        .countdown-box { display: flex; gap: 20px; margin: 30px 0; }
        .time-unit { background: rgba(255,255,255,0.2); padding: 15px; border-radius: 15px; min-width: 80px; backdrop-filter: blur(5px); }
        .time-val { font-size: 2rem; font-weight: 700; display: block; }
        
        .carousel-item img { height: 500px; object-fit: cover; border-radius: 20px; }
        .text-vibrant { color: #d946ef; }
        .btn-reservation { background: linear-gradient(45deg, #10b981, #059669); color: white; padding: 18px 50px; border-radius: 50px; font-weight: 600; transition: 0.3s; text-decoration: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-reservation:hover { transform: scale(1.05); color: white; opacity: 0.9; }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <h2 class="mb-3">You are invited to the wedding of</h2>
        <h1 class="display-2" style="font-family: 'Dancing Script', cursive;">Rendel & Danica</h1>
        <div class="countdown-box" id="countdown">
            <div class="time-unit"><span class="time-val" id="days">00</span>Days</div>
            <div class="time-unit"><span class="time-val" id="hours">00</span>Hrs</div>
            <div class="time-unit"><span class="time-val" id="minutes">00</span>Mins</div>
            <div class="time-unit"><span class="time-val" id="seconds">00</span>Secs</div>
        </div>
        <button class="btn btn-open" onclick="startExperience()">Open Invitation</button>
    </div>

    <canvas id="ambientCanvas"></canvas>

    <section class="hero-section">
        <div class="monogram">R & D</div>
        <h1 class="names">Rendel & Danica</h1>
    </section>

    <section id="invitation" class="py-5">
        <div class="container text-center">
            <h2 class="display-4 fw-bold text-vibrant mb-4" style="font-family: 'Dancing Script', cursive;">Welcome to Our Special Day!</h2>
            <p class="lead text-muted">August 29, 2026 | Salome's Garden by Chippens, Davao City</p>
        </div>

        <div class="container py-5">
            <div id="weddingCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active"><img src="https://lh3.googleusercontent.com/d/1fSwM8zyAx0geG46VOqoMu8t4HcSetNxh" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="https://lh3.googleusercontent.com/d/13LSsrxTql-mIG9Cknhu4rcuOEe6TYJ0H" class="d-block w-100"></div>
                </div>
            </div>
        </div>

        <div class="container text-center py-5">
            <h3 class="text-vibrant fw-bold mb-4">Love Gift (Rendel Moises - BDO Bank)</h3>
            <img src="https://lh3.googleusercontent.com/d/1-NUiPfH8unFWIR6wye_w4x2V1PdA-16L" class="img-fluid rounded" style="max-width: 250px;">
        </div>

        <div class="container text-center py-5">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdmKQlLZCHSXNqZvZafJWd9PhtLC7MOOcbpf0xEsYYk_Ynw7Q/viewform" class="btn btn-reservation">RSVP Now</a>
        </div>
    </section>

    <div id="player" style="display:none;"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: '_GizC-HxxiM',
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            // Player is ready
        }

        function startExperience() {
            document.getElementById('gatekeeper').style.opacity = '0';
            setTimeout(() => { document.getElementById('gatekeeper').style.display = 'none'; }, 1000);
            if (player) player.playVideo();
        }

        function updateCountdown() {
            const target = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    </script>
</body>
</html>
