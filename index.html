<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wedding Invitation</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#fffaf5;
  color:#222;
}

header {
  position:fixed;
  top:0;
  width:100%;
  background:white;
  padding:10px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

section { padding:80px 20px; max-width:900px; margin:auto; }

.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#111;
  color:white;
}

.countdown {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
}

.box {
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:10px;
}

button {
  padding:10px;
  border:none;
  cursor:pointer;
  border-radius:8px;
}

.gallery img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:10px;
}

.lightbox {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.lightbox img {
  max-width:90%;
  max-height:80%;
}

input, textarea {
  width:100%;
  padding:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<header>
  <div><b>R & D Wedding</b></div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Rendel & Danica</h1>
  <p>September 9, 2026</p>

  <div class="countdown">
    <div class="box"><span id="d">0</span><br>Days</div>
    <div class="box"><span id="h">0</span><br>Hours</div>
    <div class="box"><span id="m">0</span><br>Minutes</div>
    <div class="box"><span id="s">0</span><br>Seconds</div>
  </div>
</section>

<!-- WELCOME -->
<section>
  <h2>Welcome</h2>
  <p id="guest">Dear Guest</p>
</section>

<!-- RSVP -->
<section>
  <h2>RSVP Guestbook</h2>

  <input id="name" placeholder="Your Name"/>
  <textarea id="msg" placeholder="Message"></textarea>
  <button onclick="addWish()">Submit</button>

  <div id="list"></div>
</section>

<!-- GALLERY -->
<section class="gallery">
  <h2>Gallery</h2>
  <img src="https://picsum.photos/600/400?1" onclick="openLight(this.src)">
  <img src="https://picsum.photos/600/400?2" onclick="openLight(this.src)">
</section>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightimg">
</div>

<script>
// ===== COUNTDOWN =====
const target = new Date("2026-09-09T15:00:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const diff = target - now;

  document.getElementById("d").innerText = Math.floor(diff/(1000*60*60*24));
  document.getElementById("h").innerText = Math.floor((diff%(86400000))/3600000);
  document.getElementById("m").innerText = Math.floor((diff%3600000)/60000);
  document.getElementById("s").innerText = Math.floor((diff%60000)/1000);
},1000);

// ===== GUEST NAME =====
const url = new URLSearchParams(window.location.search);
document.getElementById("guest").innerText =
  "Dear " + (url.get("to") || "Guest");

// ===== WISHES =====
let wishes = JSON.parse(localStorage.getItem("wishes") || "[]");
render();

function addWish(){
  const n = document.getElementById("name").value;
  const m = document.getElementById("msg").value;
  if(!n || !m) return;

  wishes.unshift({n,m});
  localStorage.setItem("wishes", JSON.stringify(wishes));
  render();
}

function render(){
  document.getElementById("list").innerHTML =
    wishes.map(w=>`<p><b>${w.n}</b>: ${w.m}</p>`).join("");
}

// ===== LIGHTBOX =====
function openLight(src){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightimg").src=src;
}
</script>

</body>
</html>
